services:
  db:
    image: mariadb:10.11
    container_name: deposito_brasil_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: deposito_brasil
      MARIADB_USER: deposito_app
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - deposito_brasil_dados:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
    container_name: deposito_brasil_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: deposito_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: deposito_brasil
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      IMAGES_DIR: /app/imagens
    volumes:
      - ./imagens:/app/imagens:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: deposito_brasil_frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: deposito_brasil_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  deposito_brasil_dados:
